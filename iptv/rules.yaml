# IPTV playlist proxy rules — first match wins.
# default: exclude  →  streams that match no rule are dropped
# default: include →  streams that match no rule are kept (use a final catch-all exclude)
#
# Layering: URL type (Xtream) → country/group → event buckets (live + events only)
#
# Xtream URL shapes:
#   live:   …/{user}/{pass}/{id}  or  …/live/{user}/{pass}/{id}
#   movie:  …/movie/{user}/{pass}/{id}.ext
#   series: …/series/{user}/{pass}/{id}.ext
#
# Event name pattern (keep in sync across live exclude + events include):
# (?i)(LIVE\s*EVENT|SOLO\s*EVENTOS|2098-12-31|DAZN\s*EVENTOS?\s+\d|D\+\s*\([^)]+\)\s*Events\s+\d+)
#
# FIFA pattern (keep in sync across live/movies/series/events exclude + fifa include):
# group: (?i)FIFA   name: (?i)^FIFA

countries:
  interested: [BE, NL, ES, EN, UK, US]
  aliases: {}

playlists:
  live:
    description: Linear live TV for BE / NL / ES / EN / UK / US
    normalize_groups: true
    normalize_names: true
    default: exclude
    rules:
      - name: vod url
        action: exclude
        field: url
        pattern: '(?i)/(movie|series)/'

      - name: fifa (group)
        action: exclude
        field: group
        pattern: '(?i)FIFA'

      - name: fifa (name)
        action: exclude
        field: name
        pattern: '(?i)^FIFA'

      - name: events (group)
        action: exclude
        field: group
        pattern: '(?i)(EVENTOS?|PPV|REPLAY|event only|BACKUP|LIVE\s*EVENT|DAZN\s*(PPV|EVENT|MLB|MLS|NBA)|FIGHT\s*NIGHT|FOOTBALL.*EVENT|FORMULA\s*1\s*EVENT|COMBATE\s*EVENT|MAX\s*EVENT|RALLY\s*PPV|HUB\s*PREMIER\s*PPV|VIAPLAY\s*\(BACKUP)'

      - name: events (name)
        action: exclude
        field: name
        pattern: '(?i)(LIVE\s*EVENT|SOLO\s*EVENTOS|2098-12-31|DAZN\s*EVENTOS?\s+\d|D\+\s*\([^)]+\)\s*Events\s+\d+)'

      - name: us event buckets
        action: exclude
        field: group
        pattern: '^VIP US-.*(?i:EVENT|Events|PPV)'

      - name: pluto vod
        action: exclude
        field: group
        pattern: '(?i)PLUTO'

      - name: 24/7 movie-series loops
        action: exclude
        field: group
        pattern: '(?i)24/7.*(Movie|Series|Netflix|Prime|Apple|TOP MOVIES)'

      - name: mexican vix bucket
        action: exclude
        field: group
        pattern: '(?i)VIX DEPORTES'

      - name: movistar vod
        action: exclude
        field: group
        pattern: '(?i)M SERIES'

      - name: movistar cinema
        action: exclude
        field: group
        pattern: '(?i)M CINEMA'

      - name: movistar docs
        action: exclude
        field: group
        pattern: '(?i)DOCUMENTALES'

      - name: foreign country tags in name
        action: exclude
        field: name
        pattern: '\((MX|CA|AR|BR|CO|CL|PE|VE|EC)\)'

      - name: pluto in stream name
        action: exclude
        field: name
        pattern: '(?i)^\(PLUTO'

      - name: named 24/7 series channels
        action: exclude
        field: name
        pattern: '(?i)^24/7 [A-Z]'

      - name: us live channels
        action: include
        field: group
        pattern: '^VIP US-'

      - name: eu live interested countries
        action: include
        field: group
        pattern: '^EU[\s-]*(BE|NL|ES|EN|UK|US)\b'

  movies:
    description: VOD movies for interested countries
    normalize_groups: true
    normalize_names: true
    default: exclude
    rules:
      - name: require movie url
        action: exclude
        field: url
        pattern: '(?i)^(?!.*/movie/).*$'

      - name: fifa (group)
        action: exclude
        field: group
        pattern: '(?i)FIFA'

      - name: fifa (name)
        action: exclude
        field: name
        pattern: '(?i)^FIFA'

      - name: require interested country prefix
        action: exclude
        field: group
        pattern: '^(?!(BE|NL|ES|EN|UK|US)\|)'

      - name: interested country vod
        action: include
        field: group
        pattern: '^(BE|NL|ES|EN|UK|US)\|'

  series:
    description: VOD series for interested countries
    normalize_groups: true
    normalize_names: true
    default: exclude
    rules:
      - name: require series url
        action: exclude
        field: url
        pattern: '(?i)^(?!.*/series/).*$'

      - name: fifa (group)
        action: exclude
        field: group
        pattern: '(?i)FIFA'

      - name: fifa (name)
        action: exclude
        field: name
        pattern: '(?i)^FIFA'

      - name: require interested country prefix
        action: exclude
        field: group
        pattern: '^(?!(BE|NL|ES|EN|UK|US)\|)'

      - name: interested country vod
        action: include
        field: group
        pattern: '^(BE|NL|ES|EN|UK|US)\|'

  events:
    description: Sports and live events for BE / NL / ES / EN / UK / US
    normalize_groups: true
    normalize_names: true
    default: exclude
    rules:
      - name: vod url
        action: exclude
        field: url
        pattern: '(?i)/(movie|series)/'

      - name: fifa (group)
        action: exclude
        field: group
        pattern: '(?i)FIFA'

      - name: fifa (name)
        action: exclude
        field: name
        pattern: '(?i)^FIFA'

      - name: non-interested eu groups
        action: exclude
        field: group
        pattern: '^EU[\s-]*(?!BE\b|NL\b|ES\b|EN\b|UK\b|US\b)([A-Z]{2})\b'

      - name: vod country pipe groups
        action: exclude
        field: group
        pattern: '^(BE|NL|ES|EN|UK|US)\|'

      - name: us event groups
        action: include
        field: group
        pattern: '^VIP US-.*(?i:EVENT|Events|PPV)'

      - name: event groups (eu)
        action: include
        field: group
        pattern: '^EU[\s-]*(BE|NL|ES|EN|UK|US)\b.*(?i:EVENTOS?|PPV|REPLAY|event only|BACKUP|LIVE\s*EVENT|DAZN\s*(?:PPV|EVENT|MLB|MLS|NBA)|FIGHT\s*NIGHT|FOOTBALL.*EVENT|FORMULA\s*1\s*EVENT|COMBATE\s*EVENT|MAX\s*EVENT|RALLY\s*PPV|HUB\s*PREMIER\s*PPV|VIAPLAY\s*\(BACKUP)'

      - name: event stream names
        action: include
        field: name
        pattern: '(?i)(LIVE\s*EVENT|SOLO\s*EVENTOS|2098-12-31|DAZN\s*EVENTOS?\s+\d|D\+\s*\([^)]+\)\s*Events\s+\d+)'

  fifa:
    description: FIFA World Cup and FIFA+ channels
    normalize_groups: true
    normalize_names: true
    default: exclude
    rules:
      - name: fifa groups
        action: include
        field: group
        pattern: '(?i)FIFA'

      - name: fifa stream names
        action: include
        field: name
        pattern: '(?i)^FIFA'
